name: Construire Ripster Portable
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Installer PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Recuperer FFmpeg Windows
        shell: pwsh
        run: |
          $url = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_files
          $ffmpeg = Get-ChildItem -Path ffmpeg_files -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $ffmpeg) { throw 'ffmpeg.exe introuvable dans archive' }
          Copy-Item $ffmpeg.FullName ./ffmpeg.exe
      - name: Construire Ripster.exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Ripster --add-binary 'ffmpeg.exe;.' --add-data 'sounds;sounds' ripster.py
          if ($LASTEXITCODE -ne 0) { throw 'Echec compilation' }
      - uses: actions/upload-artifact@v4
        with:
          name: Ripster-Portable-Windows-x64
          path: dist/Ripster.exe
          if-no-files-found: error
